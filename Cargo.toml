[package]
name = "mare"
version = "0.1.0"
edition = "2024"
description = "Maré: um cliente de torrent leve para Windows, feito em Rust"
license = "MIT"
repository = "https://github.com/neonio-it/mare-torrent"
readme = "README.md"
keywords = ["torrent", "bittorrent", "egui", "windows"]
categories = ["network-programming", "gui"]

[dependencies]
anyhow = "1.0.105"
arboard = { version = "3.7.0", default-features = false }
dirs = "7.0.0"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "accesskit"] }
librqbit = "9.1"
notify-rust = "4.19.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
